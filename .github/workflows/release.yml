# Builds the Linux and the Windows package, then publishes them on a GitHub
# release.
#
# Trigger it by pushing a tag that starts with "v", for example v1.8.0. The tag
# name must match the version in package.json.
#
# Both packages are built on Linux. The zip maker needs no native tool of the
# target platform, so one runner produces both. The squirrel, deb and rpm
# makers stay unused, because every release so far shipped zip files.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the app dependencies
        run: yarn install --frozen-lockfile

      # The renderer bundle is not built by electron-forge and is not in git.
      # Without this step the packaged app has no web-page/app.js and shows an
      # empty window.
      - name: Build the renderer bundle
        working-directory: web-page
        run: |
          yarn install
          npx rollup -c

      - name: Check that the renderer bundle exists
        run: test -s web-page/app.js

      - name: Make the Linux package
        run: npx electron-forge make --platform=linux --arch=x64 --targets @electron-forge/maker-zip

      - name: Make the Windows package
        run: npx electron-forge make --platform=win32 --arch=x64 --targets @electron-forge/maker-zip

      - name: List the packages
        run: find out/make -name "*.zip" -printf "%p  %s bytes\n"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/make/**/*.zip
          retention-days: 14

      # The release notes are the section of CHANGELOG.md for this version, so
      # the release page and the change log cannot disagree.
      - name: Read the release notes from the change log
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^### " v "( |$)" {found = 1; next}
            found && /^### / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for version $version"
            exit 1
          fi
          cat release-notes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          zips=$(find out/make -name "*.zip")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $zips --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "3DT Local Viewer $version" \
              --notes-file release-notes.md \
              $zips
          fi
